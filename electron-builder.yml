appId: com.zhijian.markdown
productName: 绾搁棿
copyright: Copyright 漏 2026 绾搁棿
asar: true
compression: normal
directories:
  output: release
  buildResources: assets
files:
  - dist/**/*
  - electron/**/*
  - assets/**/*
  - package.json
extraMetadata:
  main: electron/main.cjs
win:
  icon: assets/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  artifactName: Zhijian-${version}-${arch}.${ext}
mac:
  icon: assets/icon.icns
  category: public.app-category.productivity
  identity: null
  target:
    - dmg
    - zip
  artifactName: Zhijian-${version}-mac-${arch}.${ext}
publish: null
dmg:
  sign: false
fileAssociations:
  - ext:
      - md
      - markdown
      - mdown
      - mkd
    name: Markdown 鏂囨。
    description: 浣跨敤绾搁棿鎵撳紑 Markdown 鏂囨。
    icon: assets/icon.ico
    role: Editor
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 绾搁棿
  runAfterFinish: true
  artifactName: Zhijian-${version}-setup.${ext}
portable:
  artifactName: Zhijian-${version}-portable.${ext}
  requestExecutionLevel: user
