appId: com.zhijian.markdown
productName: 纸间
copyright: Copyright © 2026 纸间
asar: true
compression: normal
directories:
  output: release
  buildResources: assets
files:
  - dist/**/*
  - electron/**/*
  - assets/**/*
  - package.json
extraMetadata:
  main: electron/main.cjs
publish:
  provider: github
  owner: AlexRaganhar
  repo: zhijian
win:
  icon: assets/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  artifactName: Zhijian-${version}-${arch}.${ext}
mac:
  icon: assets/icon.png
  category: public.app-category.productivity
  identity: null
  target:
    - dmg
    - zip
  artifactName: Zhijian-${version}-mac-${arch}.${ext}
dmg:
  sign: false
fileAssociations:
  - ext:
      - md
      - markdown
      - mdown
      - mkd
    name: Markdown 文档
    description: 使用纸间打开 Markdown 文档
    icon: assets/icon.ico
    role: Editor
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 纸间
  runAfterFinish: true
  artifactName: Zhijian-${version}-setup.${ext}
portable:
  artifactName: Zhijian-${version}-portable.${ext}
  requestExecutionLevel: user
