name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npm run build
      - run: npx electron-builder --win
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          if-no-files-found: error
          path: release/*.exe

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npm run build
      - run: npx electron-builder --mac --${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip

  release:
    name: Publish release
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          rm -f SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          append_body: true
          body: |
            ## 瀹夎璇存槑

            **Windows**锛氳繍琛?`Zhijian-*-setup.exe` 瀹夎锛屾垨鐩存帴浣跨敤 `Zhijian-*-portable.exe` 鍏嶅畨瑁呯増銆?
            **macOS**锛氭墦寮€ `Zhijian-*-mac-*.dmg`锛屾妸銆岀焊闂淬€嶆嫋杩涖€屽簲鐢ㄧ▼搴忋€嶃€傛湰娆℃瀯寤烘病鏈?Apple 寮€鍙戣€呯鍚嶏紝
            棣栨鎵撳紑闇€鍙抽敭 鈫掋€屾墦寮€銆嶏紝鎴栧湪缁堢鎵ц `xattr -cr /Applications/绾搁棿.app` 瑙ｉ櫎闅旂銆?            Apple Silicon 鐢?arm64 鍖咃紝Intel Mac 鐢?x64 鍖呫€?
            鏍￠獙涓嬭浇鏂囦欢锛歚sha256sum -c SHA256SUMS.txt`銆?